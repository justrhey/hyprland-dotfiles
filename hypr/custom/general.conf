# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`

# ─── Glassmorphism: no window outline + frosted glass ───
general {
    border_size = 0
}

decoration {
    # Translucency so the blur behind shows through (the "glass")
    active_opacity = 0.96
    inactive_opacity = 0.92
    dim_inactive = false

    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true   # blur even through window opacity -> frosted look
        xray = false            # blur windows behind too (more depth), not just wallpaper
        new_optimizations = true
        vibrancy = 0.4
    }

    # Native-style elevation belongs to windows, not a painted outline.
    shadow {
        enabled = true
        range = 24
        offset = 0 6
        render_power = 3
        color = rgba(00000050)
    }
}
