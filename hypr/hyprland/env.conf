# ############ Wayland #############
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ############ Multi-GPU / Intel + NVIDIA #############
# Card1 = Intel HD 530 (iGPU connected to laptop screen eDP-1)
# Card0 = NVIDIA GeForce 940MX (dGPU - legacy 470 driver)
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
# Do not force NVIDIA GBM on legacy 470 driver on Wayland
# ############ VA-API Hardware Video Acceleration #############
env = LIBVA_DRIVER_NAME,iHD
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = WLR_NO_HARDWARE_CURSORS,1

######### Applications #########
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# ############ Themes #############
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, kde
env = XDG_MENU_PREFIX, plasma-

# ######## Virtual envrionment #########
env = ILLOGICAL_IMPULSE_VIRTUAL_ENV, ~/.local/state/quickshell/.venv

# ######## Terminal application #########
env = TERMINAL,kitty -1
